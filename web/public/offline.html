<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FOCUSLY – Offline</title>
    <style>
      body { font-family: system-ui, sans-serif; min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f6f7fb; color: #171a2b; text-align: center; }
      .box { padding: 24px; max-width: 420px; }
      button { background: #5b5bd6; color: #fff; border: none; padding: 10px 18px; border-radius: 10px; font: inherit; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="box">
      <img src="/icons/icon-192.png" width="72" height="72" alt="" />
      <h1>Bạn đang offline</h1>
      <p>Không kết nối được mạng. Trên điện thoại, app FOCUSLY vẫn cho phép học và ghi nhận offline – dữ liệu sẽ tự đồng bộ khi có mạng.</p>
      <button onclick="location.reload()">Thử lại</button>
    </div>
  </body>
</html>
