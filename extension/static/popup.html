<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="popup">
    <header><img src="icons/icon32.png" width="24" height="24" alt="" /> <b>FOCUSLY Shield</b></header>
    <div id="status" class="status">…</div>
    <div id="goal" class="goal"></div>
    <div id="domains" class="chips"></div>
    <hr />
    <div class="row">
      <input id="minutes" type="number" min="1" max="480" value="25" style="width:72px" /> <span class="muted small">phút</span>
      <button id="manual-start">Chặn ngay</button>
      <button id="manual-stop" class="secondary" hidden>Dừng chặn thủ công</button>
    </div>
    <div id="manual-info" class="muted small"></div>
    <hr />
    <div id="connection" class="muted small"></div>
    <div id="error" class="error small"></div>
    <div class="row">
      <button id="refresh" class="secondary small-btn">Làm mới</button>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
