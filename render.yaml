services:
  - type: web
    name: focusly-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build && npm run db:indexes
    startCommand: npm start
    healthCheckPath: /health
    # Các biến tuỳ chọn (Cloudinary, ANTHROPIC_API_KEY, SMTP, Firebase, Google)
    # thêm sau trong Render: Dashboard > focusly-api > Environment
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_EXTENSION_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: WEB_URL
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: AI_MODEL
        value: claude-haiku-5-5
