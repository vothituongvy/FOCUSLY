# Chạy toàn bộ FOCUSLY bằng Docker:  docker compose -f docker-compose.prod.yml up -d --build
# Web: http://localhost:3000 · API: http://localhost:4000
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - focusly-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/focusly
      CORS_ORIGINS: http://localhost:3000
      WEB_URL: http://localhost:3000
      PUBLIC_API_URL: http://localhost:4000
    ports:
      - "4000:4000"
    volumes:
      - focusly-uploads:/app/uploads

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  focusly-mongo:
  focusly-uploads:
